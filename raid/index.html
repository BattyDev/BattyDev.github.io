<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved to /fcevents</title>
<!-- The sub-site moved from /raid to /fcevents when "Raid Nights" became
     "FC Events". This stub exists so links already shared -- in Discord, in
     bookmarks, in the announce embeds posted before the move -- still land in
     the right place.

     GitHub Pages serves static files and cannot issue a 301, so this is the
     only redirect available. It is canonical + noindex so search engines treat
     /fcevents as the real address rather than indexing both. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://battydev.com/fcevents/">
<script>
  /* The hash carries the route -- #/event/<id> for a shared event link -- and a
     meta refresh would drop it, so do the redirect in script and keep it.
     location.replace rather than assignment: the stub should not sit in the
     back history, where Back would bounce the reader straight forward again. */
  (function () {
    var to = '../fcevents/' + (window.location.search || '') + (window.location.hash || '');
    window.location.replace(to);
  })();
</script>
<!-- Inside noscript on purpose. Left in the open it fires ALONGSIDE the script
     above, adding a history entry for this stub -- so Back from /fcevents would
     land here and be bounced forward again. In noscript it only applies when
     the script did not run, which is exactly when it is needed. -->
<noscript><meta http-equiv="refresh" content="0; url=../fcevents/"></noscript>
</head>
<body>
<p>This page moved to <a href="../fcevents/">battydev.com/fcevents</a>.</p>
<noscript><p>If you followed a link to a specific event, open it again from the
events list once you are there — a refresh cannot carry the link's fragment.</p></noscript>
</body>
</html>
