<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07151c">
<title>Baby · BattyDev</title>
<!-- Private section: keep it out of search results regardless of the lock. -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="shared/baby.css?v=4" rel="stylesheet">
</head>
<body>

<div class="wallpaper" aria-hidden="true"></div>

<!-- The section's own front page: unlisted on battydev.com, and nothing here
     renders until the database confirms the signed-in account is on the
     allow-list (see shared/auth.js). To add a section, give it a folder like
     progress/ and a tile below. -->
<div id="app" hidden>
  <header class="home-bar">
    <a class="account" href="../index.html" aria-label="Return to BattyDev">
      <span class="gamerpic">B</span>
      <span><b>Baby</b><small>BattyDev</small></span>
    </a>
    <div class="system-status" style="margin-left:auto">
      <span id="updated" class="stamp">—</span>
      <button type="button" class="signout" id="lock">Sign out</button>
    </div>
  </header>

  <main>
    <div id="banner" class="notice" hidden></div>
    <div id="sample" class="notice is-info" hidden>
      Showing <b>sample data</b>: the appointments, checklist and savings figures are placeholders.
    </div>

    <div class="section-head hub-head">
      <p class="eyebrow">Getting ready</p>
      <h1 id="hub-heading">Baby</h1>
      <p class="lede" id="hub-lede"></p>
    </div>

    <nav class="tiles" aria-label="Sections">
      <a class="tile tile-progress" href="progress/">
        <i class="bi bi-balloon-heart tile-icon" aria-hidden="true"></i>
        <strong>Progress</strong>
        <span class="tile-sum" id="tile-progress">Week by week, month by month.</span>
        <div class="bar"><span id="tile-progress-bar"></span></div>
      </a>
      <a class="tile tile-savings" href="savings/">
        <i class="bi bi-piggy-bank tile-icon" aria-hidden="true"></i>
        <strong>Savings</strong>
        <span class="tile-sum" id="tile-savings">What we are saving for.</span>
        <div class="bar"><span id="tile-savings-bar"></span></div>
      </a>
    </nav>
  </main>
</div>

<script src="shared/weeks.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/auth.js?v=4"></script>
<script src="shared/savings-model.js?v=3"></script>
<script>
'use strict';
BB.unlock((data) => {
  BB.chrome(data);
  const P = BB.pregnancy(data.pregnancy && data.pregnancy.due);
  if (P) {
    const w = BABY_WEEKS[Math.max(4, Math.min(41, P.week))];
    BB.$('hub-heading').textContent = P.left >= 0 ? `${BB.plural(P.left, 'day')} to go` : 'Any day now';
    BB.$('hub-lede').textContent = `${BB.TRI_NAME[P.tri]}.`;
    BB.$('tile-progress').innerHTML = `<b>${P.week}w ${P.day}d</b> · about the size of a ${BB.esc(w.size)}`;
    BB.$('tile-progress-bar').style.width = `${(P.pct * 100).toFixed(1)}%`;
  }
  const S = SavingsModel(data.savings, P);
  BB.$('tile-savings').innerHTML = `<b>${BB.usd(S.covered)}</b> of ${BB.usd(S.target)} · ${Math.round(S.pct * 100)}%`;
  BB.$('tile-savings-bar').style.width = `${(Math.min(1, S.pct) * 100).toFixed(1)}%`;
});
</script>
</body>
</html>
