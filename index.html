<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07151c">
  <title>BattyDev</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box}
    body{min-width:320px;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#071117;color:#fff;padding:24px}
    main{width:100%;max-width:560px}
    h1{margin:0 0 6px;font-size:2rem;font-weight:900;letter-spacing:.01em}
    p.intro{margin:0 0 28px;color:#9fb0b7;font-size:.95rem}
    .projects{display:grid;gap:12px}
    a.project{display:block;padding:18px 20px;border:1px solid #ffffff19;border-radius:8px;background:#0d1b23;color:#fff;text-decoration:none;transition:border-color .16s ease,transform .16s ease}
    a.project:hover,a.project:focus-visible{border-color:#66edf1;transform:translateY(-2px);outline:none}
    a.project strong{display:block;font-size:1.1rem;margin-bottom:4px}
    a.project span{display:block;color:#9fb0b7;font-size:.85rem}
  </style>
</head>
<body>
  <main>
    <h1>BattyDev</h1>
    <p class="intro">A few small projects live here.</p>
    <div class="projects">
      <a class="project" href="palworld/">
        <strong>Palworld Server Status</strong>
        <span>Live dashboard for the Batty Mac Palworld community server</span>
      </a>
    </div>
  </main>
</body>
</html>
