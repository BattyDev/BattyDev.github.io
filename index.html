<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07151c">
  <title>BattyDev</title>
  <meta name="description" content="Live dashboards for the games BattyDev plays.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* Game tiles, in the Xbox-dashboard language the sub-sites already use:
       cover art first, caption riding a scrim at the bottom, lift + white
       outline on hover. */
    :root{
      color-scheme:dark;
      --void:#07151c;
      --ink:#fff;
      --ink-dim:#9fb0b7;
      --aqua:#66edf1;
      --green:#9bf00b;
      font-family:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{
      min-width:320px;margin:0;min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      background:var(--void);color:var(--ink);
      padding:clamp(24px,6vw,64px) 24px;
    }
    /* faint aqua bloom so the page isn't a flat black field behind the art */
    body::before{
      content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;
      background:radial-gradient(ellipse 90% 60% at 50% 0%,#66edf114,transparent 70%);
    }
    main{width:100%;max-width:980px}

    header{margin-bottom:clamp(28px,5vw,44px)}
    h1{
      margin:0 0 4px;font-size:clamp(2.4rem,7vw,3.4rem);font-weight:900;
      line-height:.95;letter-spacing:-.02em;text-transform:uppercase;
    }
    h1 b{color:var(--aqua);font-weight:900}
    p.intro{margin:0;color:var(--ink-dim);font-size:.95rem}

    .projects{
      display:grid;gap:clamp(14px,2.5vw,20px);
      grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
    }

    a.project{
      position:relative;display:block;overflow:hidden;
      aspect-ratio:3/2;border-radius:10px;
      background:#11202a;color:var(--ink);text-decoration:none;
      box-shadow:0 10px 30px #0007;
      outline:0 solid #fff;outline-offset:3px;
      transition:transform .18s ease,box-shadow .18s ease,outline-width .18s ease;
    }
    a.project img{
      width:100%;height:100%;object-fit:cover;display:block;
      transition:transform .35s ease,filter .18s ease;
    }
    /* scrim keeps the caption readable over any part of the art */
    a.project::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(0deg,#050f16f2 0,#05101788 42%,transparent 72%);
    }
    a.project .caption{
      position:absolute;z-index:1;left:0;right:0;bottom:0;
      padding:clamp(16px,3vw,22px);
    }
    a.project strong{
      display:block;font-size:clamp(1.25rem,2.6vw,1.5rem);font-weight:900;
      line-height:1.05;text-transform:uppercase;text-shadow:0 2px 12px #000a;
    }
    a.project span{
      display:block;margin-top:5px;color:#d4e0e4;font-size:.82rem;
      line-height:1.35;text-shadow:0 1px 8px #000a;
    }
    /* aqua rule that wipes in under the title on hover */
    a.project .caption::before{
      content:"";display:block;width:34px;height:3px;margin-bottom:10px;
      background:var(--aqua);border-radius:2px;
      transform-origin:left;transform:scaleX(0);opacity:0;
      transition:transform .22s ease,opacity .22s ease;
    }

    a.project:hover,a.project:focus-visible{
      transform:translateY(-6px);
      outline-width:3px;box-shadow:0 18px 44px #0009;
    }
    a.project:hover img,a.project:focus-visible img{
      transform:scale(1.05);filter:brightness(1.08) saturate(1.1);
    }
    a.project:hover .caption::before,a.project:focus-visible .caption::before{
      transform:scaleX(1);opacity:1;
    }
    a.project:focus-visible{outline:3px solid var(--green)}

    @media (prefers-reduced-motion:reduce){
      a.project,a.project img,a.project .caption::before{transition:none}
      a.project:hover,a.project:focus-visible{transform:none}
      a.project:hover img,a.project:focus-visible img{transform:none}
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Batty<b>Dev</b></h1>
      <p class="intro">A few small projects live here.</p>
    </header>

    <div class="projects">
      <a class="project" href="palworld/">
        <img src="assets/tile-palworld.jpg" alt="" width="900" height="600" decoding="async">
        <div class="caption">
          <strong>Palworld Server Status</strong>
          <span>Live dashboard for the Batty Mac Palworld community server</span>
        </div>
      </a>
      <a class="project" href="ffxiv/">
        <img src="assets/tile-ffxiv.jpg" alt="" width="900" height="600" decoding="async">
        <div class="caption">
          <strong>FFXIV Adventurers</strong>
          <span>Lodestone progress for the Wild Hearts Free Company</span>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
