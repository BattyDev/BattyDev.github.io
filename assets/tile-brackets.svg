<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="A tournament bracket collapsing from eight entrants to one">
  <!-- Cover art for the /brackets tile on the site's front page.
       Drawn rather than photographed: the other two tiles use their game's key
       art, and there is no key art for a bracket site. Borrowing a publisher's
       is not an option, and a screenshot of a UI makes a poor 3:2 tile, so this
       is the thing itself — a bracket draining to one winner — in the palette
       the rest of the site already uses.

       SVG, so it is 3kB rather than 120kB and stays sharp on any display. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0d2430"/>
      <stop offset="1" stop-color="#06121a"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.72" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#66edf1" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#66edf1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="winner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66edf1"/>
      <stop offset="1" stop-color="#9bf00b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#ground)"/>
  <rect width="900" height="600" fill="url(#bloom)"/>

  <!-- Connectors, drawn under the cards so the joins tuck behind them. -->
  <g fill="none" stroke="#66edf1" stroke-opacity="0.42" stroke-width="2.5" stroke-linecap="round">
    <!-- round 1 into round 2 -->
    <path d="M214 96 h30 v52 h30"/>
    <path d="M214 200 h30 v-52"/>
    <path d="M214 304 h30 v52 h30"/>
    <path d="M214 408 h30 v-52"/>
    <!-- round 2 into the final -->
    <path d="M418 148 h30 v104 h30"/>
    <path d="M418 356 h30 v-104"/>
    <!-- final into the winner -->
    <path d="M622 252 h34"/>
  </g>

  <!-- Round one: eight entrants, four sets. -->
  <g>
    <g fill="#12283a" fill-opacity="0.92" stroke="#66edf1" stroke-opacity="0.22">
      <rect x="70" y="72" width="144" height="48" rx="6"/>
      <rect x="70" y="176" width="144" height="48" rx="6"/>
      <rect x="70" y="280" width="144" height="48" rx="6"/>
      <rect x="70" y="384" width="144" height="48" rx="6"/>
    </g>
    <!-- The two name rows inside each card, as bars rather than lettering:
         a real tag would read as a specific person's, and a placeholder name
         would date the tile the first time the demo data changes. -->
    <g fill="#9fb0b7" fill-opacity="0.55">
      <rect x="84" y="83" width="86" height="7" rx="3.5"/>
      <rect x="84" y="102" width="64" height="7" rx="3.5"/>
      <rect x="84" y="187" width="72" height="7" rx="3.5"/>
      <rect x="84" y="206" width="92" height="7" rx="3.5"/>
      <rect x="84" y="291" width="60" height="7" rx="3.5"/>
      <rect x="84" y="310" width="88" height="7" rx="3.5"/>
      <rect x="84" y="395" width="94" height="7" rx="3.5"/>
      <rect x="84" y="414" width="70" height="7" rx="3.5"/>
    </g>
    <!-- Winner of each round-one set, lit. -->
    <g fill="#66edf1">
      <rect x="84" y="83" width="86" height="7" rx="3.5"/>
      <rect x="84" y="206" width="92" height="7" rx="3.5"/>
      <rect x="84" y="291" width="60" height="7" rx="3.5"/>
      <rect x="84" y="395" width="94" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- Round two. -->
  <g>
    <g fill="#12283a" fill-opacity="0.92" stroke="#66edf1" stroke-opacity="0.3">
      <rect x="274" y="124" width="144" height="48" rx="6"/>
      <rect x="274" y="332" width="144" height="48" rx="6"/>
    </g>
    <g fill="#9fb0b7" fill-opacity="0.55">
      <rect x="288" y="135" width="86" height="7" rx="3.5"/>
      <rect x="288" y="154" width="60" height="7" rx="3.5"/>
      <rect x="288" y="343" width="64" height="7" rx="3.5"/>
      <rect x="288" y="362" width="94" height="7" rx="3.5"/>
    </g>
    <g fill="#66edf1">
      <rect x="288" y="135" width="86" height="7" rx="3.5"/>
      <rect x="288" y="362" width="94" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- The final, outlined the way a live set is in the app. -->
  <g>
    <rect x="478" y="228" width="144" height="48" rx="6"
          fill="#12283a" fill-opacity="0.95" stroke="#66edf1" stroke-width="2"/>
    <rect x="492" y="239" width="86" height="7" rx="3.5" fill="#66edf1"/>
    <rect x="492" y="258" width="94" height="7" rx="3.5" fill="#9fb0b7" fill-opacity="0.55"/>
  </g>

  <!-- The winner. -->
  <g>
    <rect x="656" y="228" width="168" height="48" rx="6" fill="#0b1d28"
          stroke="url(#winner)" stroke-width="2.5"/>
    <rect x="672" y="245" width="104" height="9" rx="4.5" fill="url(#winner)"/>
    <!-- A small trophy, the same stroke language as the icons in the app. -->
    <g transform="translate(788 240)" fill="none" stroke="#9bf00b"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20h12M10 15v5M2 1h16v7a8 8 0 0 1-16 0z" transform="scale(0.85)"/>
    </g>
  </g>
</svg>
