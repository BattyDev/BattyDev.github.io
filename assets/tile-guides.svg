<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="A stack of guide pages, the top one showing a row of section tabs and a page of text">
  <!-- Cover art for the /guides tile on the site's front page.
       Drawn for the same reason tile-brackets.svg is: there is no key art for a
       shelf of write-ups, and a screenshot of text makes a poor 3:2 tile. So
       this is the thing itself — a paginated guide, its section rail across the
       top with one section open — in the palette the rest of the site uses.

       Bars rather than lettering throughout. Real words would have to be a
       specific guide's, and would date the tile the first time one is added.

       The composition is pushed into the top two thirds on purpose: the tile's
       caption rides a scrim over the bottom ~28%, so anything drawn down there
       is detail nobody sees. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0d2430"/>
      <stop offset="1" stop-color="#06121a"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.28" cy="0.22" r="0.78">
      <stop offset="0" stop-color="#66edf1" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#66edf1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66edf1"/>
      <stop offset="1" stop-color="#9bf00b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#ground)"/>
  <rect width="900" height="600" fill="url(#bloom)"/>

  <!-- Two pages behind the open one: the shelf holds more than this guide, and
       the pager has more than this section. -->
  <rect x="156" y="36" width="588" height="372" rx="10"
        fill="#0e2130" fill-opacity="0.75" stroke="#66edf1" stroke-opacity="0.12"/>
  <rect x="133" y="53" width="634" height="372" rx="10"
        fill="#102636" fill-opacity="0.88" stroke="#66edf1" stroke-opacity="0.16"/>

  <!-- The open page. -->
  <rect x="110" y="70" width="680" height="372" rx="10"
        fill="#12283a" fill-opacity="0.96" stroke="#66edf1" stroke-opacity="0.28"/>

  <!-- Section rail. The second chip is the open section, filled the way the
       active chip is on a real guide. -->
  <g>
    <g fill="none" stroke="#66edf1" stroke-opacity="0.30">
      <rect x="142" y="104" width="62" height="22" rx="4"/>
      <rect x="302" y="104" width="70" height="22" rx="4"/>
      <rect x="382" y="104" width="84" height="22" rx="4"/>
      <rect x="476" y="104" width="66" height="22" rx="4"/>
      <rect x="552" y="104" width="74" height="22" rx="4"/>
      <rect x="636" y="104" width="66" height="22" rx="4"/>
    </g>
    <g fill="#9fb0b7" fill-opacity="0.45">
      <rect x="154" y="112" width="38" height="6" rx="3"/>
      <rect x="314" y="112" width="46" height="6" rx="3"/>
      <rect x="394" y="112" width="60" height="6" rx="3"/>
      <rect x="488" y="112" width="42" height="6" rx="3"/>
      <rect x="564" y="112" width="50" height="6" rx="3"/>
      <rect x="648" y="112" width="42" height="6" rx="3"/>
    </g>
    <rect x="214" y="104" width="78" height="22" rx="4" fill="#66edf1"/>
    <rect x="226" y="112" width="54" height="6" rx="3" fill="#07151c" fill-opacity="0.8"/>
  </g>
  <path d="M142 144 H758" stroke="#66edf1" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Eyebrow, then the heading, lit the way the winner is on the brackets tile. -->
  <rect x="142" y="164" width="88" height="6" rx="3" fill="#3aa8ac"/>
  <rect x="142" y="182" width="310" height="16" rx="8" fill="url(#head)"/>

  <!-- Body. -->
  <g fill="#9fb0b7" fill-opacity="0.55">
    <rect x="142" y="220" width="544" height="8" rx="4"/>
    <rect x="142" y="242" width="588" height="8" rx="4"/>
    <rect x="142" y="264" width="438" height="8" rx="4"/>
  </g>

  <!-- A callout: the pulled-out claim a section hangs on. -->
  <g>
    <rect x="142" y="294" width="486" height="58" rx="5"
          fill="#66edf1" fill-opacity="0.07" stroke="#66edf1" stroke-opacity="0.22"/>
    <rect x="142" y="294" width="4" height="58" rx="2" fill="#9bf00b"/>
    <rect x="162" y="309" width="104" height="6" rx="3" fill="#9bf00b" fill-opacity="0.85"/>
    <rect x="162" y="327" width="404" height="7" rx="3.5" fill="#9fb0b7" fill-opacity="0.5"/>
  </g>

  <!-- The pager: previous, a count, next. -->
  <path d="M142 380 H758" stroke="#66edf1" stroke-opacity="0.18" stroke-width="2"/>
  <g fill="none" stroke="#66edf1" stroke-opacity="0.55" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M163 398 l-8 8 8 8"/>
    <path d="M737 398 l8 8 -8 8"/>
  </g>
  <g fill="#9fb0b7" fill-opacity="0.45">
    <rect x="175" y="402" width="52" height="7" rx="3.5"/>
    <rect x="673" y="402" width="52" height="7" rx="3.5"/>
  </g>
  <rect x="430" y="402" width="40" height="7" rx="3.5" fill="#66edf1" fill-opacity="0.5"/>
</svg>
