# Publishes the built site to the `dist` branch after CI passes on main.
# BattyDev.github.io checks that branch out into /gwent when it deploys.
name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Push dist/ to the dist branch
        run: |
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.event.workflow_run.head_sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
      # Optional: rebuild battydev.com straight away instead of waiting for its
      # hourly schedule. Needs a fine-grained PAT with Contents: read and write
      # on BattyDev.github.io, stored here as SITE_DISPATCH_TOKEN.
      - name: Ask the site to rebuild
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No SITE_DISPATCH_TOKEN; the site picks this up on its hourly rebuild."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/BattyDev/BattyDev.github.io/dispatches \
            -d '{"event_type":"gwent-updated"}'
