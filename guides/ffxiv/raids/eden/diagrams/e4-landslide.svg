<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" role="img" aria-labelledby="ti de">
<title id="ti">Massive Landslide and Left / Right Landslide</title>
<desc id="de">In his gauntlets form Titan swings behind and to both sides with Massive Landslide, so the
  safe ground is in front of him. He then follows with Left or Right Landslide, which erupts one
  half of the arena. The cast name is written from Titan's point of view, so watch the arm he
  winds up rather than the word, and cross to the other half.</desc>
<style>
  .bg{fill:#0b1d28}
  .tile{fill:#122a38;stroke:#2b5a6b;stroke-width:1}
  .lbl{font:700 9.5px 'Arial Narrow',Arial,sans-serif;fill:#9db2c0;letter-spacing:.08em}
  .tiny{font:700 8.5px 'Arial Narrow',Arial,sans-serif;fill:#7d94a4;letter-spacing:.1em}
  .cap{font:700 9.5px 'Arial Narrow',Arial,sans-serif;fill:#66edf1;letter-spacing:.1em}
  .bad{fill:#e2564d;fill-opacity:.28;stroke:#e2564d;stroke-width:1.2}
  .ok{fill:#9bf00b;fill-opacity:.18;stroke:#9bf00b;stroke-width:1.3}
  .titan{fill:#c98b3c;fill-opacity:.95}
  .fist{fill:#f0b429;stroke:#07151c;stroke-width:1.2}
  .p{fill:#e8eef2;stroke:#07151c;stroke-width:1.3}
  .face{fill:none;stroke:#66edf1;stroke-width:1.4}
  .cross{transform:translate(-88px,0)}
  @media (prefers-reduced-motion:no-preference){
    .cross{animation:cross 7s ease-in-out infinite}
    .bad{animation:tell 7s linear infinite}
    .fist{animation:wind 7s ease-in-out infinite}
    @keyframes cross{0%,30%{transform:translate(0,0)}55%,100%{transform:translate(-88px,0)}}
    @keyframes tell{0%,22%{opacity:.3}40%,100%{opacity:1}}
    @keyframes wind{0%,20%{transform:translate(0,0)}36%,100%{transform:translate(6px,-4px)}}
  }
</style>
<rect class="bg" width="360" height="250" rx="4"/>

<!-- Massive Landslide: safe in front -->
<text class="cap" x="96" y="24" text-anchor="middle">MASSIVE LANDSLIDE</text>
<rect class="tile" x="24" y="42" width="144" height="144"/>
<path class="bad" d="M24 42 h144 v108 H24 Z"/>
<rect class="ok" x="24" y="150" width="144" height="36"/>
<circle class="titan" cx="96" cy="114" r="13"/>
<path class="face" d="M96 132 l-7 -10 h14 z"/>
<circle class="p" cx="60" cy="168" r="5"/><circle class="p" cx="84" cy="168" r="5"/>
<circle class="p" cx="108" cy="168" r="5"/><circle class="p" cx="132" cy="168" r="5"/>
<text class="tiny" x="96" y="204" text-anchor="middle" textLength="159" lengthAdjust="spacingAndGlyphs">HE SWINGS BEHIND AND BOTH SIDES —</text>
<text class="tiny" x="96" y="215" text-anchor="middle" textLength="159" lengthAdjust="spacingAndGlyphs">THE STRIP IN FRONT IS THE SAFE ONE</text>

<!-- Left / Right Landslide: read the raised fist -->
<text class="cap" x="266" y="24" text-anchor="middle">LEFT / RIGHT LANDSLIDE</text>
<rect class="tile" x="194" y="42" width="144" height="144"/>
<rect class="bad" x="266" y="42" width="72" height="144"/>
<rect class="ok" x="194" y="42" width="72" height="144"/>
<circle class="titan" cx="266" cy="114" r="13"/>
<circle class="fist" cx="286" cy="104" r="7"/>
<text class="tiny" x="310" y="96" text-anchor="middle">WIND-UP</text>
<g class="cross"><circle class="p" cx="296" cy="146" r="5"/><circle class="p" cx="312" cy="160" r="5"/>
  <circle class="p" cx="300" cy="172" r="5"/><circle class="p" cx="284" cy="160" r="5"/></g>
<text class="tiny" x="266" y="204" text-anchor="middle" textLength="163" lengthAdjust="spacingAndGlyphs">THE ARM HE WINDS UP IS THE SIDE</text>
<text class="tiny" x="266" y="215" text-anchor="middle" textLength="163" lengthAdjust="spacingAndGlyphs">"LEFT" IS HIS LEFT · READ THE ARM</text>

<text class="lbl" x="180" y="238" text-anchor="middle">Both come from the gauntlets form, back to back</text>
</svg>
