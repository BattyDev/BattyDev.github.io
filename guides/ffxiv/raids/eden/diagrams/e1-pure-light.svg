<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" role="img" aria-labelledby="ti de">
<title id="ti">Pure Light — get behind</title>
<desc id="de">Pure Light covers almost the whole platform in front of Eden Prime. The only safe
  ground is the narrow wedge directly behind it, so the whole party walks around the boss
  during the cast.</desc>
<style>
  .bg{fill:#0b1d28}
  .floor{fill:#122a38;stroke:#2b5a6b;stroke-width:1.5}
  .lbl{font:700 11px 'Arial Narrow',Arial,sans-serif;fill:#9db2c0;letter-spacing:.08em}
  .tiny{font:700 9px 'Arial Narrow',Arial,sans-serif;fill:#7d94a4;letter-spacing:.1em}
  .cap{font:700 10px 'Arial Narrow',Arial,sans-serif;fill:#66edf1;letter-spacing:.14em}
  .boss{fill:#66edf1;fill-opacity:.85}
  .p{stroke:#07151c;stroke-width:1.4}
  .mt{fill:#66edf1}.ot{fill:#3aa8ac}.hl{fill:#9bf00b}.dp{fill:#ff6f82}
  .cone{fill:#e2564d;fill-opacity:.26;stroke:#e2564d;stroke-width:1.2}
  .ok{fill:#9bf00b;fill-opacity:.16;stroke:#9bf00b;stroke-width:1.3}
  .face{fill:none;stroke:#66edf1;stroke-width:1.4;stroke-opacity:.8}
  .party{transform:rotate(180deg)}
  @media (prefers-reduced-motion:no-preference){
    .party{animation:walk 8s ease-in-out infinite}
    .cone{animation:tell 8s linear infinite}
    @keyframes walk{
      0%,10%{transform:rotate(0deg)}
      50%,100%{transform:rotate(180deg)}
    }
    @keyframes tell{0%,12%{fill-opacity:.1}40%,100%{fill-opacity:.26}}
  }
  .party{transform-origin:180px 128px}
</style>
<rect class="bg" width="360" height="250" rx="4"/>
<rect class="floor" x="72" y="24" width="216" height="208" rx="26"/>

<!-- the cast covers the whole platform except a wedge behind the boss -->
<path class="cone" fill-rule="evenodd"
  d="M98 24 h164 a26 26 0 0 1 26 26 v156 a26 26 0 0 1 -26 26 H98 a26 26 0 0 1 -26 -26 V50 a26 26 0 0 1 26 -26 Z
     M180 128 L96 232 L264 232 Z"/>
<path class="ok" d="M180 128 L96 232 h168 Z"/>
<text class="tiny" x="180" y="226" text-anchor="middle">SAFE — DIRECTLY BEHIND</text>

<circle class="boss" cx="180" cy="128" r="13"/>
<path class="face" d="M180 112 l-7 10 h14 z"/>
<text class="tiny" x="214" y="140" text-anchor="start">FACING</text>

<g class="party">
  <circle class="p mt" cx="168" cy="106" r="5.5"/>
  <circle class="p ot" cx="192" cy="106" r="5.5"/>
  <circle class="p hl" cx="156" cy="98"  r="5.5"/>
  <circle class="p hl" cx="204" cy="98"  r="5.5"/>
  <circle class="p dp" cx="168" cy="88"  r="5.5"/>
  <circle class="p dp" cx="192" cy="88"  r="5.5"/>
  <circle class="p dp" cx="156" cy="78"  r="5.5"/>
  <circle class="p dp" cx="204" cy="78"  r="5.5"/>
</g>

<text class="cap" x="180" y="16" text-anchor="middle">PURE LIGHT · WALK AROUND, DO NOT RUN OUT</text>
<text class="lbl" x="180" y="246" text-anchor="middle">The platform edge kills — there is no "far enough away"</text>
</svg>
