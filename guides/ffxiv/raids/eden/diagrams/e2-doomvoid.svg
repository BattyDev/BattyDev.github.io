<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" role="img" aria-labelledby="ti de">
<title id="ti">Doomvoid Guillotine versus Doomvoid Slicer</title>
<desc id="de">The two Doomvoid casts have opposite safe spots. Guillotine is a band across the
  whole arena, so the safe ground is off to the sides. Slicer covers the whole room except a
  circle under Voidwalker, so the safe ground is underneath the boss.</desc>
<style>
  .bg{fill:#0b1d28}
  .floor{fill:#122a38;stroke:#2b5a6b;stroke-width:1.5}
  .lbl{font:700 9.5px 'Arial Narrow',Arial,sans-serif;fill:#9db2c0;letter-spacing:.08em}
  .tiny{font:700 8.5px 'Arial Narrow',Arial,sans-serif;fill:#7d94a4;letter-spacing:.1em}
  .cap{font:700 9.5px 'Arial Narrow',Arial,sans-serif;fill:#66edf1;letter-spacing:.12em}
  .p{stroke:#07151c;stroke-width:1.3;fill:#e8eef2}
  .boss{fill:#c9a6ff;fill-opacity:.9}
  .bad{fill:#e2564d;fill-opacity:.28;stroke:#e2564d;stroke-width:1.2}
  .ok{fill:#9bf00b;fill-opacity:.16;stroke:#9bf00b;stroke-width:1.3}
  .add{fill:#7d94a4;fill-opacity:.9}
  .marchOut{transform:translate(0,var(--d))}
  .marchIn{transform:translate(0,var(--d))}
  @media (prefers-reduced-motion:no-preference){
    .marchOut{animation:mo 7s ease-in-out infinite}
    .marchIn{animation:mi 7s ease-in-out infinite}
    .bad{animation:tell 7s linear infinite}
    @keyframes mo{0%,30%{transform:translate(0,0);opacity:0}40%{opacity:1}100%{transform:translate(0,var(--d));opacity:1}}
    @keyframes mi{0%,30%{transform:translate(0,0);opacity:0}40%{opacity:1}100%{transform:translate(0,var(--d));opacity:1}}
    @keyframes tell{0%,18%{opacity:.3}34%,100%{opacity:1}}
  }
</style>
<rect class="bg" width="360" height="250" rx="4"/>

<!-- Guillotine -->
<text class="cap" x="96" y="20" text-anchor="middle">DOOMVOID GUILLOTINE</text>
<circle class="floor" cx="96" cy="128" r="66"/>
<path class="bad" d="M30 106 h132 v44 H30 Z"/>
<path class="ok" d="M33.8 106 A66 66 0 0 1 158.2 106 Z M33.8 150 A66 66 0 0 0 158.2 150 Z"/>
<circle class="boss" cx="96" cy="128" r="10"/>
<circle class="p" cx="96" cy="86" r="5"/>
<circle class="p" cx="78" cy="94" r="5"/>
<circle class="p" cx="96" cy="170" r="5"/>
<circle class="p" cx="114" cy="162" r="5"/>
<g class="marchOut" style="--d:-44px"><circle class="add" cx="66" cy="128" r="4.5"/></g>
<g class="marchOut" style="--d:44px"><circle class="add" cx="126" cy="128" r="4.5"/></g>
<text class="tiny" x="96" y="212" text-anchor="middle" textLength="159" lengthAdjust="spacingAndGlyphs">BAND ACROSS THE ROOM · SIDES</text>

<!-- Slicer -->
<text class="cap" x="264" y="20" text-anchor="middle">DOOMVOID SLICER</text>
<circle class="floor" cx="264" cy="128" r="66"/>
<path class="bad" fill-rule="evenodd" d="M264 62 A66 66 0 1 1 263.9 62 Z M234 128 A30 30 0 1 0 294 128 A30 30 0 1 0 234 128 Z"/>
<circle class="ok" cx="264" cy="128" r="30"/>
<circle class="boss" cx="264" cy="128" r="10"/>
<circle class="p" cx="250" cy="118" r="5"/>
<circle class="p" cx="278" cy="118" r="5"/>
<circle class="p" cx="250" cy="142" r="5"/>
<circle class="p" cx="278" cy="142" r="5"/>
<g class="marchIn" style="--d:34px"><circle class="add" cx="264" cy="72" r="4.5"/></g>
<g class="marchIn" style="--d:-34px"><circle class="add" cx="264" cy="184" r="4.5"/></g>
<text class="tiny" x="264" y="212" text-anchor="middle" textLength="159" lengthAdjust="spacingAndGlyphs">ALL BUT THE BOSS · GET UNDER</text>

<text class="lbl" x="180" y="240" text-anchor="middle" textLength="347" lengthAdjust="spacingAndGlyphs">Grey dots are the untargetable adds each cast leaves walking across the floor</text>
</svg>
