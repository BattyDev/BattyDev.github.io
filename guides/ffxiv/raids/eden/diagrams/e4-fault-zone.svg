<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" role="img" aria-labelledby="ti de">
<title id="ti">Fault Zone and Magnitude 5.0 — the wheels sequence</title>
<desc id="de">In his wheels form Titan lines up on a row and charges down it with Fault Zone, three
  times, taking a new row each pass. Stand on his flank, on the side with more tiles left. The
  sequence ends with Magnitude 5.0, a donut whose only safe ground is against his hitbox.</desc>
<style>
  .bg{fill:#0b1d28}
  .tile{fill:#122a38;stroke:#2b5a6b;stroke-width:1}
  .lbl{font:700 9.5px 'Arial Narrow',Arial,sans-serif;fill:#9db2c0;letter-spacing:.08em}
  .tiny{font:700 8.5px 'Arial Narrow',Arial,sans-serif;fill:#7d94a4;letter-spacing:.1em}
  .cap{font:700 9.5px 'Arial Narrow',Arial,sans-serif;fill:#66edf1;letter-spacing:.1em}
  .bad{fill:#e2564d;fill-opacity:.28;stroke:#e2564d;stroke-width:1.2}
  .ok{fill:#9bf00b;fill-opacity:.18;stroke:#9bf00b;stroke-width:1.3}
  .titan{fill:#c98b3c;fill-opacity:.95}
  .p{fill:#e8eef2;stroke:#07151c;stroke-width:1.3}
  @media (prefers-reduced-motion:no-preference){
    .dash{animation:dash 6s ease-in-out infinite}
    .ring{animation:ring 6s ease-in-out infinite}
    @keyframes dash{0%,20%{transform:translate(0,0)}55%,100%{transform:translate(108px,0)}}
    @keyframes ring{0%,45%{opacity:.25}62%,100%{opacity:1}}
  }
</style>
<rect class="bg" width="360" height="250" rx="4"/>

<!-- Fault Zone -->
<text class="cap" x="96" y="24" text-anchor="middle" textLength="159" lengthAdjust="spacingAndGlyphs">FAULT ZONE · TAKE THE FLANK</text>
<g class="tile">
  <rect x="24" y="42" width="36" height="36"/><rect x="60" y="42" width="36" height="36"/>
  <rect x="96" y="42" width="36" height="36"/><rect x="132" y="42" width="36" height="36"/>
  <rect x="24" y="78" width="36" height="36"/><rect x="60" y="78" width="36" height="36"/>
  <rect x="96" y="78" width="36" height="36"/><rect x="132" y="78" width="36" height="36"/>
  <rect x="24" y="114" width="36" height="36"/><rect x="60" y="114" width="36" height="36"/>
  <rect x="96" y="114" width="36" height="36"/><rect x="132" y="114" width="36" height="36"/>
  <rect x="24" y="150" width="36" height="36"/><rect x="60" y="150" width="36" height="36"/>
  <rect x="96" y="150" width="36" height="36"/><rect x="132" y="150" width="36" height="36"/>
</g>
<rect class="bad" x="24" y="78" width="144" height="36"/>
<rect class="ok" x="24" y="114" width="144" height="72"/>
<g class="dash"><circle class="titan" cx="36" cy="96" r="12"/></g>
<circle class="p" cx="72" cy="132" r="5"/><circle class="p" cx="96" cy="132" r="5"/>
<circle class="p" cx="84" cy="166" r="5"/><circle class="p" cx="120" cy="150" r="5"/>
<text class="tiny" x="96" y="204" text-anchor="middle" textLength="159" lengthAdjust="spacingAndGlyphs">STAND ON THE WIDE SIDE — HE TAKES</text>
<text class="tiny" x="96" y="215" text-anchor="middle" textLength="159" lengthAdjust="spacingAndGlyphs">A NEW ROW EACH PASS, THREE TIMES</text>

<!-- Magnitude 5.0 -->
<text class="cap" x="266" y="24" text-anchor="middle">MAGNITUDE 5.0 · GET IN</text>
<rect class="tile" x="194" y="42" width="144" height="144"/>
<path class="bad ring" fill-rule="evenodd" d="M194 42 h144 v144 H194 Z M266 78 A36 36 0 1 0 266 150 A36 36 0 1 0 266 78 Z"/>
<circle class="ok" cx="266" cy="114" r="36"/>
<circle class="titan" cx="266" cy="114" r="12"/>
<circle class="p" cx="252" cy="100" r="5"/><circle class="p" cx="280" cy="100" r="5"/>
<circle class="p" cx="252" cy="128" r="5"/><circle class="p" cx="280" cy="128" r="5"/>
<text class="tiny" x="266" y="204" text-anchor="middle" textLength="163" lengthAdjust="spacingAndGlyphs">DONUT — THE ONLY SAFE GROUND IS</text>
<text class="tiny" x="266" y="215" text-anchor="middle">HIS HITBOX. RUN IN, NOT OUT.</text>

<text class="lbl" x="180" y="238" text-anchor="middle" textLength="347" lengthAdjust="spacingAndGlyphs">The dash knocks back as well as hits — do not take it standing over open air</text>
</svg>
